<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#161320" />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="apple-touch-icon" href="/icon-180.png" />
<link rel="icon" type="image/png" href="/icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@400;600;700&family=Noto+Sans+Thai:wght@400;600&display=swap" rel="stylesheet" />
<title>มัธยม</title>
<script>
// ตัวดักข้อผิดพลาดตอนเริ่มเกม — เกมที่พังแล้วขึ้นหน้าขาวเปล่าคือสิ่งที่แก้ไม่ได้เลย
// ทั้งสำหรับผู้เล่นบน iPad และสำหรับคนที่ต้องมาไล่หาสาเหตุทีหลัง
// ต้องเขียนด้วยของพื้นฐานล้วน เพราะมันต้องทำงานได้แม้ตอนที่ทุกอย่างอื่นพัง
(function () {
  var shown = false;
  function show(what, e) {
    if (shown) return; shown = true;
    var d = document.createElement("div");
    d.setAttribute("style", "position:fixed;inset:0;z-index:99999;padding:24px;overflow:auto;" +
      "background:#140f12;color:#f0e6d8;font:14px/1.7 ui-monospace,monospace;white-space:pre-wrap");
    d.textContent = "เกมเริ่มไม่ขึ้น (" + what + ")\n\n" +
      ((e && (e.stack || e.message)) || String(e)) +
      "\n\nWebGL: " + (function () {
        try { var c = document.createElement("canvas");
              return (c.getContext("webgl2") || c.getContext("webgl")) ? "ใช้ได้" : "ใช้ไม่ได้"; }
        catch (x) { return "เช็กไม่ได้: " + x; }
      })();
    (document.body || document.documentElement).appendChild(d);
  }
  addEventListener("error", function (e) { show("error", e.error || e.message); });
  addEventListener("unhandledrejection", function (e) { show("promise", e.reason); });
})();
</script>
</head>
<body>
<div id="app">
  <header id="top">
    <div id="dateRow">
      <div class="datewrap"><div id="chapter"></div><div id="date"></div></div>
      <div id="headBtns">
        <button class="tbtn ic" id="bSound" aria-label="เปิดปิดเสียง">♪</button>
        <button class="tbtn ic" id="bMenu" aria-label="เมนู">☰</button>
      </div>
    </div>
    <div id="termBar"></div>
    <div id="periodStrip"></div>
    <div id="stats"></div>
  </header>
  <main id="board"></main>
  <section id="scene" class="hidden">
    <div id="sceneTools">
      <button class="stool" id="bLog">ย้อนอ่าน</button>
      <button class="stool" id="bAuto">ออโต้</button>
    </div>
    <div id="backlog" class="hidden"></div>
    <div id="sceneBg" class="hidden"></div>
    <div id="sceneBox">
      <div id="portrait"></div>
      <div id="sceneText">
        <div id="speaker"></div>
        <div id="line"></div>
      </div>
    </div>
    <div id="hint"></div>
    <div id="choices"></div>
  </section>
  <div id="daycard" class="hidden"></div>
  <div id="panel" class="hidden"></div>
  <div id="minigame" class="hidden"></div>
  <footer id="foot">
    <div id="bottom"></div>
    <nav id="topBtns" aria-label="เมนูหลัก">
      <button class="tbtn" id="bChat">ไลน์</button>
      <button class="tbtn" id="bChars">คนรู้จัก</button>
      <button class="tbtn" id="bGrade">สมุดพก</button>
      <button class="tbtn" id="bBag">กระเป๋า</button>
      <button class="tbtn" id="bCal">ปฏิทิน</button>
    </nav>
  </footer>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
