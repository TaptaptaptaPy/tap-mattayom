<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#161320" />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="apple-touch-icon" href="/icon-180.png" />
<link rel="icon" type="image/png" href="/icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@400;600;700&family=Noto+Sans+Thai:wght@400;600&display=swap" rel="stylesheet" />
<title>มัธยม</title>
</head>
<body>
<div id="app">
  <header id="top">
    <div id="dateRow">
      <div id="date"></div>
      <div id="topBtns">
        <button class="tbtn" id="bChat">ไลน์</button>
        <button class="tbtn" id="bChars">คนรู้จัก</button>
        <button class="tbtn" id="bBag">กระเป๋า</button>
        <button class="tbtn" id="bCal">ปฏิทิน</button>
        <button class="tbtn" id="bMenu">เมนู</button>
      </div>
    </div>
    <div id="periodStrip"></div>
    <div id="stats"></div>
  </header>
  <main id="board"></main>
  <section id="scene" class="hidden">
    <div id="sceneBg" class="hidden"></div>
    <div id="sceneBox">
      <div id="portrait"></div>
      <div id="sceneText">
        <div id="speaker"></div>
        <div id="line"></div>
      </div>
    </div>
    <div id="hint"></div>
    <div id="choices"></div>
  </section>
  <div id="daycard" class="hidden"></div>
  <div id="panel" class="hidden"></div>
  <div id="minigame" class="hidden"></div>
  <footer id="bottom"></footer>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
